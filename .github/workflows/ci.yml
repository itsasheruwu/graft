name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck application
        run: npx tsc --noEmit -p tsconfig.app.json

      - name: Test Spotify bridge
        run: node --test macos/Tests/SpotifyBridgeResourceTests.mjs

      - name: Run tests
        run: npm test

      - name: Build extension
        run: npm run build

      - name: Verify dist output
        run: |
          test -f dist/manifest.json
          test -f dist/popup.html
          test -f dist/options.html
          test -f dist/src/background/service_worker.js

  native-build-and-test:
    runs-on: macos-15
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
      - name: Build and test native app and bridge
        run: swift test --package-path macos
